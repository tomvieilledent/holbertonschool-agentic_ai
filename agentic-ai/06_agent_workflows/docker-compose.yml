services:
  task-watcher:
    build:
      context: .
    image: agentic-ops-06-task-watcher:latest
    container_name: task-watcher
    volumes:
      - ./tasks.json:/app/tasks.json:ro
    restart: unless-stopped
    user: "node"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
